name: 個股報告申請收件匣

# docs/lab_eq_request_plan.md 第 3.2 節；程式 scripts/eq_inbox.py＋arm/lab/eqinbox.py。
# 網頁按「要個股報告」→ GitHub 申請單（.github/ISSUE_TEMPLATE/eq-report.yml）→ 這支把開著的申請單和佇列對帳：
# 收單（排進 data/eq_requests.json、回第幾位）、看不懂或沒資料就回一句並關單、報告進 main 之後回連結並關單。
# ① 有人開單、改單、重開單；② daily.yml 跑完（報告走它的併檔通道進 main）；③ 每天台北 22:23 兜底；④ 手動。
# 安全：每次都從 API 重讀單、不用事件內容；單上的文字只交給 eqinbox.parse 取代號，不放進任何指令（tests/test_eqinbox.py 守）。

on:
  issues:
    types: [opened, edited, reopened]
  workflow_run:
    workflows: ['復華基金追蹤版本 每日 routine']
    types: [completed]
  schedule:
    - cron: '23 14 * * *'
  workflow_dispatch:

concurrency:
  group: eq-inbox
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  inbox:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: 對帳申請單
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          TZ: Asia/Taipei
        run: python3 scripts/eq_inbox.py

      - name: 佇列有變才 commit
        run: |
          git config user.name "josephchan00000"
          git config user.email "51159474+josephchan00000@users.noreply.github.com"
          git add data/eq_requests.json 2>/dev/null || true
          if git diff --cached --quiet; then echo "佇列沒變"; exit 0; fi
          git commit -m "chore: 個股報告申請佇列 $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M')"
          for i in 1 2 3; do
            git push origin HEAD:main && exit 0
            echo "push 被拒（第 $i 次），rebase 後重試…"
            git pull --rebase origin main || { git rebase --abort; exit 1; }
          done
          exit 1
