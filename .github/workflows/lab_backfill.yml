name: 籌碼雷達回補（一次性／手動）

# 2026-10-14 建立：ETF 持股個股籌碼雷達（arm/lab/）的歷史回補。
#   · 從 git 歷史回補 ETF 部位（需 fetch-depth: 0）
#   · 官方全市場價量（約 1 年）＋個股籌碼（約 3 個月）——按日期一次一請求、可重跑續補
# 每日增量由 afterhours_refresh.yml／etf_holdings.yml 的 fetch_lab.py 負責，本檔只做一次性回補。
#
# 觸發：
#   · workflow_dispatch（main 上）
#   · claude/** 分支 push 動到 .ping/lab（未 merge 前在分支上驗證用；內容寫 probe＝只跑探針）
# 結果 commit 回「被觸發的那個分支」。

on:
  workflow_dispatch:
    inputs:
      probe:
        description: "只跑探針（逐端點印診斷），不寫檔"
        type: boolean
        default: false
      px_days:
        description: "價量回補日曆天數"
        default: "380"
      flow_days:
        description: "籌碼回補日曆天數"
        default: "95"
      mode:
        description: "指定模式（同 .ping/lab 第一行，例 mgnfill）；空白＝依 probe 勾選"
        default: ""
  push:
    branches: ['claude/**']
    paths: ['.ping/lab']

concurrency:
  # push（.ping/lab）與 workflow_dispatch 分兩組：mgnfill 用 dispatch 跑好幾個小時，期間推 .ping/lab 的其他模式照樣能跑
  group: lab-backfill-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: write              # mgnfill 沒做完時自己再派一次（workflow_dispatch，同一個分支）

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 350      # mgnfill（融資維持率回補）一輪約 5.5 小時；其他模式各自有 timeout／時間預算
    env:
      TZ: Asia/Taipei
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0          # pos 回補要走 data/etf_holdings.json 的完整 git 歷史

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依（純標準庫 + certifi）
        run: pip install --quiet certifi pypdf

      - name: 回補
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}   # 只有 ussxfill 的 SEC 那一段與 secprobe 讀（arm/lab/secfin.py），不印、不存
        run: |
          MODE="full"
          if [ "${{ github.event_name }}" = "push" ]; then
            # 哨兵檔被刪（例如合併前清理）也會觸發 push → 沒有檔就什麼都不做
            if [ ! -f .ping/lab ]; then echo "無 .ping/lab，略過"; exit 0; fi
            MODE=$(head -1 .ping/lab 2>/dev/null | tr -d '[:space:]')
          elif [ -n "${{ inputs.mode }}" ]; then
            MODE="${{ inputs.mode }}"
          elif [ "${{ inputs.probe }}" = "true" ]; then
            MODE="probe"
          fi
          PX="${{ inputs.px_days || '380' }}"
          FL="${{ inputs.flow_days || '95' }}"
          echo "模式：$MODE（價量 $PX 天、籌碼 $FL 天）"
          if [ "$MODE" = "probe" ]; then
            python3 scripts/backfill_lab.py --probe
          elif [ "${MODE#usstkprobe}" != "$MODE" ]; then
            # 美股個股策略的資料探針（docs/lab_core70_plan.md）：財報行事曆能回到哪一年、已下市股票有沒有股價、SEC 會不會擋；只印不寫
            timeout 900 python3 scripts/probe_usstk.py
          elif [ "${MODE#usstkfill}" != "$MODE" ]; then
            # 美股個股策略的資料回補（docs/lab_core70_plan.md 第 9 節）：S&P 500 歷史成分股的 Yahoo 股價＋那斯達克財報行事曆
            # 2008 年起逐日（約 4,900 個請求）。每 50 分鐘存檔＋commit 一次，跑到約 330 分鐘，沒做完就自己再派一輪。
            git config user.name "josephchan00000"
            git config user.email "51159474+josephchan00000@users.noreply.github.com"
            T_END=$(( $(date +%s) + 330 * 60 ))
            : > /tmp/us_status.txt
            while [ "$(date +%s)" -lt "$T_END" ]; do
              LEFT=$(( (T_END - $(date +%s)) / 60 ))
              BUD=$(( LEFT < 50 ? LEFT : 50 ))
              [ "$BUD" -lt 5 ] && break
              timeout $(( BUD * 60 + 600 )) python3 scripts/backfill_usstk.py --budget-min "$BUD" || true
              python3 scripts/backfill_usstk.py --status | tee /tmp/us_status.txt
              git add -f data/lab/usstk 2>/dev/null || true
              if git commit -q -m "chore: 美股個股資料回補 $(date '+%F %H:%M')"; then
                for i in 1 2 3; do
                  git push -q origin HEAD:${{ github.ref_name }} && break
                  git pull -q --rebase origin ${{ github.ref_name }} || git rebase --abort || true
                  sleep 5
                done
              fi
              grep -q "^DONE" /tmp/us_status.txt && break
              grep -q "^STUCK" /tmp/us_status.txt && break
            done
            if ! grep -q "^DONE\|^STUCK" /tmp/us_status.txt; then
              echo "還沒做完：再派一輪"
              gh workflow run lab_backfill.yml --ref "${{ github.ref_name }}" -f mode=usstkfill || echo "::warning::再派失敗，請手動派 mode=usstkfill"
            fi
          elif [ "${MODE#ussxfill}" != "$MODE" ]; then
            # 美股飆股研究的資料（docs/lab_us_sleeve_plan.md 第 8 節）：約 5,200 檔的 Yahoo 開高低收量與配息分割、指數 ETF、
            # 那斯達克產業分類、SEC 財報（要 secret SEC_CONTACT_EMAIL，沒有就跳過）。資料兩三百 MB，只放資料分支 claude/ussx-data。
            if [ "${{ github.ref_name }}" != "claude/ussx-data" ]; then
              echo "::error::ussxfill 只能在資料分支 claude/ussx-data 跑（資料兩三百 MB，不能進 ${{ github.ref_name }}）"; exit 1
            fi
            git config user.name "josephchan00000"
            git config user.email "51159474+josephchan00000@users.noreply.github.com"
            T_END=$(( $(date +%s) + 330 * 60 ))
            : > /tmp/ussx_status.txt
            while [ "$(date +%s)" -lt "$T_END" ]; do
              LEFT=$(( (T_END - $(date +%s)) / 60 ))
              BUD=$(( LEFT < 50 ? LEFT : 50 ))
              [ "$BUD" -lt 5 ] && break
              timeout $(( BUD * 60 + 600 )) python3 scripts/backfill_ussx.py --budget-min "$BUD" || true
              python3 scripts/backfill_ussx.py --status | tee /tmp/ussx_status.txt
              git add -f data/lab/ussx 2>/dev/null || true
              if git commit -q -m "chore: 美股飆股資料回補 $(date '+%F %H:%M')"; then
                for i in 1 2 3; do
                  git push -q origin HEAD:${{ github.ref_name }} && break
                  git pull -q --rebase origin ${{ github.ref_name }} || git rebase --abort || true
                  sleep 5
                done
              fi
              grep -q "^DONE" /tmp/ussx_status.txt && break
              grep -q "^STUCK" /tmp/ussx_status.txt && break
            done
            if ! grep -q "^DONE\|^STUCK" /tmp/ussx_status.txt; then
              echo "還沒做完：再派一輪"
              gh workflow run lab_backfill.yml --ref "${{ github.ref_name }}" -f mode=ussxfill || echo "::warning::再派失敗，請手動派 mode=ussxfill"
            fi
          elif [ "${MODE#secprobe}" != "$MODE" ]; then
            # 美股財報「一次性利得／損失」項目的探針（美股三成營益率的研究，2026-10-24）：只印不寫
            timeout 1800 python3 scripts/probe_secgain.py
          elif [ "${MODE#s3probe}" != "$MODE" ]; then
            # 大神策略第三段的資料探針（FinMind 逐檔融資與收盤、終止上市櫃名單、美股漲跌家數來源）：只印不寫
            timeout 1500 python3 scripts/probe_s3.py
          elif [ "${MODE#mgnfill}" != "$MODE" ]; then
            # 台股融資維持率回補（docs/lab_expert_plan.md 第 10 節）：FinMind 逐檔，每小時最多 280 個請求（未登入 300）。
            # 用 workflow_dispatch 帶 mode=mgnfill 跑（不佔 push 那一組）；每 50 分鐘存檔＋commit 一次，跑到約 330 分鐘，
            # 沒做完就自己再派一輪（同一個分支、同一個模式）。
            git config user.name "josephchan00000"
            git config user.email "51159474+josephchan00000@users.noreply.github.com"
            T_END=$(( $(date +%s) + 330 * 60 ))
            : > /tmp/mr_status.txt
            while [ "$(date +%s)" -lt "$T_END" ]; do
              LEFT=$(( (T_END - $(date +%s)) / 60 ))
              BUD=$(( LEFT < 50 ? LEFT : 50 ))
              [ "$BUD" -lt 5 ] && break
              timeout $(( BUD * 60 + 600 )) python3 scripts/backfill_mratio.py --budget-min "$BUD" || true
              python3 scripts/backfill_mratio.py --status | tee /tmp/mr_status.txt
              git add -f data/lab/mratio data/lab/heat/mratio.json.gz 2>/dev/null || true
              if git commit -q -m "chore: 融資維持率回補 $(date '+%F %H:%M')"; then
                for i in 1 2 3; do
                  git push -q origin HEAD:${{ github.ref_name }} && break
                  git pull -q --rebase origin ${{ github.ref_name }} || git rebase --abort || true
                  sleep 5
                done
              fi
              grep -q "^DONE" /tmp/mr_status.txt && break
              grep -q "^STUCK" /tmp/mr_status.txt && break
            done
            if ! grep -q "^DONE\|^STUCK" /tmp/mr_status.txt; then
              echo "還沒做完：再派一輪"
              gh workflow run lab_backfill.yml --ref "${{ github.ref_name }}" -f mode=mgnfill || echo "::warning::再派失敗，請手動派 mode=mgnfill"
            fi
          elif [ "${MODE#uscard}" != "$MODE" ]; then
            # 美股個股卡的每天資料（docs/lab_cfg_v2_plan.md 第 4 節）：一年日線＋Yahoo 分析師預估、目標價、下次財報日。
            # 先在分支上跑一輪確認抓得到（不管這個收盤有沒有抓過都重抓）；結果 commit 回這個分支
            pip install --quiet numpy || true
            TZ=Asia/Taipei timeout 300 python3 scripts/fetch_ussx_watch.py --card-force
          elif [ "$MODE" = "probe2" ]; then
            python3 scripts/backfill_lab.py --probe2
          elif [ "$MODE" = "probe3" ]; then
            python3 scripts/backfill_lab.py --probe3
          elif [ "$MODE" = "growth" ] || [ "${MODE#growth}" != "$MODE" ]; then
            python3 scripts/backfill_lab.py --growth --budget-min 50
          elif [ "$MODE" = "yahoo" ]; then
            python3 scripts/backfill_lab.py --yahoo
          elif [ "$MODE" = "yhl" ] || [ "${MODE#yhl}" != "$MODE" ]; then
            python3 scripts/backfill_lab.py --yhl --budget-min 45
          elif [ "$MODE" = "hd" ] || [ "${MODE#hd}" != "$MODE" ]; then
            python3 scripts/backfill_lab.py --hd --budget-min 45
          elif [ "$MODE" = "names" ]; then
            python3 scripts/backfill_lab.py --names
          elif [ "${MODE#fsfill}" != "$MODE" ]; then
            python3 scripts/backfill_lab.py --fs --budget-min 48
          elif [ "${MODE#fcfill}" != "$MODE" ]; then
            python3 scripts/fetch_fcst.py --backfill 260 --full --budget 2400
          elif [ "$MODE" = "probefs" ]; then
            python3 scripts/backfill_lab.py --probe-fs
          elif [ "${MODE#indfill}" != "$MODE" ]; then
            python3 scripts/backfill_lab.py --ind-hist --budget-min 50
          elif [ "$MODE" = "icfill" ]; then
            timeout 900 python3 scripts/backfill_lab.py --ic-chain
          elif [ "$MODE" = "revprobe" ]; then
            python3 scripts/backfill_lab.py --rev-probe
          elif [ "${MODE#v3fill}" != "$MODE" ]; then
            python3 scripts/backfill_lab.py --v3 --budget-min 48
          elif [ "$MODE" = "probev3" ] || [ "$MODE" = "probev3b" ]; then
            LAB_MODE="$MODE" python3 scripts/backfill_lab.py --probe-v3
          elif [ "$MODE" = "revmops" ] || [ "${MODE#revmops}" != "$MODE" ]; then
            python3 scripts/backfill_lab.py --rev-mops --budget-min 45
          elif [ "$MODE" = "revfm" ] || [ "${MODE#revfm}" != "$MODE" ]; then
            python3 scripts/backfill_lab.py --rev-fm --budget-min 50
          elif [ "${MODE#usfill:}" != "$MODE" ]; then
            # usfill:us_cp,cp_probe＝美股來源只回補冒號後面這幾個（泡沫頁 VER 2 的美國企業獲利；fwd_probe＝VER 4 未來獲利探針）
            pip install --quiet xlrd openpyxl || true
            timeout 1200 python3 scripts/fetch_heat_us.py --backfill --only "${MODE#usfill:}"
          elif [ "$MODE" = "usfill" ]; then
            # 美股景氣與台股泡沫面向的資料回補（docs/lab_heat_us_plan.md U3）：全部來源從頭抓、加權指數 1990～1998
            pip install --quiet xlrd openpyxl || true
            timeout 3000 python3 scripts/fetch_heat_us.py --backfill
          elif [ "$MODE" = "heatfill" ] || [ "${MODE#heatfill}" != "$MODE" ]; then
            # heatfill:ndc,pmi＝只回補這幾個（冒號後面）；其他寫法＝全部回補
            REST="${MODE#heatfill}"
            ONLY=""
            case "$REST" in :*) ONLY="--only ${REST#:}";; esac
            timeout 3000 python3 scripts/fetch_heat.py --backfill --budget-min 45 $ONLY
          else
            python3 scripts/backfill_lab.py --pos-git --px-days "$PX" --flow-days "$FL" --budget-min 50
          fi

      - name: commit 回補分片（回到被觸發的分支）
        run: |
          git config user.name "josephchan00000"
          git config user.email "51159474+josephchan00000@users.noreply.github.com"
          git add -f data/lab 2>/dev/null || true
          git commit -m "chore: 籌碼雷達回補 $(date '+%F %H:%M')" || { echo "無變更"; exit 0; }
          for i in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} && exit 0
            git pull --rebase origin ${{ github.ref_name }} || git rebase --abort || true
            sleep 5
          done
          echo "::error::push 失敗"; exit 1
