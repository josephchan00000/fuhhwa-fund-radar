name: ETF 每日持股（無頭瀏覽器）

# 為什麼獨立成一支 workflow（2026-07-29）：
#   投信官網幾乎都是 SPA、持股由 XHR 動態載入，靜態 HTTP 抓不到（逐家逆向 6 輪的結論）。
#   無頭瀏覽器渲染一次就全部解決、且不怕改版，但安裝＋渲染要 1–3 分鐘。
#   放進 daily.yml 會壓縮「早上 07:03 前線上可看當日內容」的目標，所以**完全分開跑**：
#   本 job 只更新 data/etf_holdings.json 並 commit，儀表板下一次建表自然吃到
#   （資料層本就是「抓取在 CI、建表只讀落檔」）。本 job 失敗不影響任何現有功能——
#   該 ETF 就是沒有展開明細而已。

on:
  schedule:
    # 台北 17:40（UTC 09:40）——台股收盤後、投信當日 PCF 已更新；
    # 與隔日清晨的 daily.yml 完全錯開，不佔早上的關鍵路徑。
    - cron: "40 9 * * 1-5"
  workflow_dispatch:

concurrency:
  group: etf-holdings
  cancel-in-progress: false      # 與 daily.yml 各自 commit 同一檔的機會極低，但不互相取消

permissions:
  contents: write

jobs:
  holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝 Playwright + Chromium
        run: |
          pip install --quiet certifi playwright
          python -m playwright install --with-deps chromium

      - name: 渲染各投信 PCF 頁、抓每日持股
        run: TZ=Asia/Taipei python3 scripts/fetch_etf_holdings_browser.py

      - name: commit 持股落檔
        run: |
          git config user.name "josephchan00000"
          git config user.email "51159474+josephchan00000@users.noreply.github.com"
          git add -f data/etf_holdings.json 2>/dev/null || true
          git commit -m "chore: ETF 每日持股更新 $(date +%F)" || { echo "無變更，跳過 push"; exit 0; }
          # main 可能被 daily.yml 推進 → rebase 重試；本檔只有本 job 會寫，衝突機率低
          for i in 1 2 3; do
            git push && exit 0
            echo "push 被拒（第 $i 次），rebase 後重試…"
            git pull --rebase origin main || git rebase --abort || true
            sleep 5
          done
          echo "::error::push 連續失敗——本次持股未入 main"; exit 1
