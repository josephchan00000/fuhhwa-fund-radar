name: ETF 每日持股（彙整站雙源）

# 2026-07-29 定案（使用者指示）：不抓投信官網第一手（逐家逆向 7 輪＋瀏覽器 3 輪的結論：
# SPA/WAF 長尾），改彙整站雙源——etfinfo `/api/etf/{code}`（完整每日快照，CI 可達性已被
# etf_watch 證實數週）為主、MoneyDJ SSR 持股頁交叉驗證（並補 etfinfo 未收錄的上櫃檔）。
# 純 HTTP、每輪數十秒；瀏覽器版 fetch_etf_holdings_browser.py 保留為備援、不排程。
# 獨立 workflow 的理由不變：不佔 daily.yml「07:03 前線上可看」的關鍵路徑；
# 本 job 只更新 data/etf_holdings.json 並 commit，失敗不影響任何現有功能。

on:
  schedule:
    # 台北 17:40（UTC 09:40）——台股收盤後、投信當日 PCF 已更新；
    # 與隔日清晨的 daily.yml 完全錯開，不佔早上的關鍵路徑。
    - cron: "40 9 * * 1-5"
  workflow_dispatch:

concurrency:
  group: etf-holdings
  cancel-in-progress: false      # 與 daily.yml 各自 commit 同一檔的機會極低，但不互相取消

permissions:
  contents: write

jobs:
  holdings:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依（純標準庫 + certifi）
        run: pip install --quiet certifi

      - name: 抓每日持股（本家 fhtrust 第一手＋etfinfo 主＋Yahoo 構成驗證）
        run: TZ=Asia/Taipei python3 scripts/fetch_etf_holdings.py

      - name: 重建儀表板（2026-07-30 使用者：持股更新排進每日循環——傍晚抓完直接上線，
              當日貢獻當晚可見，不等隔日早上 daily.yml）
        run: TZ=Asia/Taipei python3 scripts/gen_fund_dashboard.py

      - name: commit 持股落檔＋儀表板
        run: |
          git config user.name "josephchan00000"
          git config user.email "51159474+josephchan00000@users.noreply.github.com"
          git add -f data/etf_holdings.json 2>/dev/null || true
          git add -f data/stock_industry.json 2>/dev/null || true
          git add dashboard/index.html 2>/dev/null || true
          git commit -m "chore: ETF 每日持股更新 $(date +%F)" || { echo "無變更，跳過 push"; exit 0; }
          # main 可能被其他 workflow 推進 → rebase 重試；rebase 後用合併結果重建再推
          #（同 daily.yml 慣例：-X theirs 會拼出新舊混雜的 index.html，必須重建）
          for i in 1 2 3; do
            git push && exit 0
            echo "push 被拒（第 $i 次），rebase 後重建儀表板再重試…"
            git pull --rebase -X theirs origin main || git rebase --abort || true
            TZ=Asia/Taipei python3 scripts/gen_fund_dashboard.py || true
            git add dashboard/index.html 2>/dev/null || true
            git commit --amend --no-edit || true
            sleep 5
          done
          echo "::error::push 連續失敗——本次持股未入 main"; exit 1

      - name: 觸發 Vercel 部署（Deploy Hook；未設 secret 則跳過、靠自動偵測）
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "（未設 VERCEL_DEPLOY_HOOK secret，跳過主動部署）"; exit 0
          fi
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK" -w "\nHTTP %{http_code}\n" \
            || echo "deploy hook 呼叫失敗（不影響已入庫的 commit）"
