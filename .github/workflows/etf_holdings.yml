name: ETF 每日持股（彙整站雙源）

# 2026-07-29 定案（使用者指示）：不抓投信官網第一手（逐家逆向 7 輪＋瀏覽器 3 輪的結論：
# SPA/WAF 長尾），改彙整站雙源——etfinfo `/api/etf/{code}`（完整每日快照，CI 可達性已被
# etf_watch 證實數週）為主、MoneyDJ SSR 持股頁交叉驗證（並補 etfinfo 未收錄的上櫃檔）。
# 純 HTTP、每輪數十秒；瀏覽器版 fetch_etf_holdings_browser.py 保留為備援、不排程。
# 獨立 workflow 的理由不變：不佔 daily.yml「07:03 前線上可看」的關鍵路徑；
# 本 job 只更新 data/etf_holdings.json 並 commit，失敗不影響任何現有功能。

on:
  schedule:
    # 兩班、**每天都跑**（不限週一~五）。2026-08-01 使用者指示：「每天都要更新」。
    #
    # 台北 17:40（UTC 09:40）——台股收盤後，**主動式 ETF（00xxxA）**當日 PCF 此時已更新。
    - cron: "40 9 * * *"
    # 台北 06:15（UTC 前一日 22:15）——**被動式 ETF 隔夜才發 PCF**。
    # 2026-08-01 使用者回報「持股異動沒有跟著每天更新」的根因（實證）：
    #   07/30 19:33 抓取時 0050／0056／006208／00878／00919／00929／00407A／00994A 這 8 檔
    #   仍是 07-29 的快照，隔日 08:01 才變成 07-30 → 只有 17:40 一班的話，這批（含最熱門的
    #   0050／0056／00878／00919／00929）**永遠慢一個交易日**，看板上的異動自然天天像沒動。
    # 排在 daily.yml（台北 06:35）之前，讓清晨那次權威重建就帶到最新持股。
    - cron: "15 22 * * *"
    #
    # 為何週末也跑（不怕空轉）：假日投信不發新 PCF，抓回來與既有快照相同 →
    # merge_one 的「同一份快照」防呆不推進日期、不動 prev，**無 diff 就不 commit**，
    # 等於只多兩次數十秒的 HTTP 探詢。換來的是「不必推理今天星期幾」——
    # 連假後第一個交易日、補班日、颱風假這些例外全部自動涵蓋，不會再有排程漏班。
  workflow_dispatch:
    inputs:
      probe:
        description: "只跑探針（第三方驗證來源可達性／解析診斷），不落檔、不部署"
        type: boolean
        default: false

concurrency:
  group: etf-holdings
  cancel-in-progress: false      # 與 daily.yml 各自 commit 同一檔的機會極低，但不互相取消

permissions:
  contents: write

jobs:
  holdings:
    runs-on: ubuntu-latest
    # 同 afterhours_refresh 2026-08-07 教訓：timeout 含排隊時間，本班 17:40 cron 實測
    # 常遲 1.5~3 小時、落在容量低谷，10 分鐘排隊上限太緊會平白吃 failure 信。
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
        with:
          # 正式抓取一律以 main 為準（排程／自動觸發）；**探針模式用被 dispatch 的分支**——
          # 否則探針跑的是 main 上的舊腳本，新加的候選來源根本不會被打到
          #（2026-07-30 踩到：workflow 檔取自分支、程式碼卻取自 main，日誌完全沒有探針輸出）
          ref: ${{ inputs.probe && github.ref_name || 'main' }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # numpy：建頁時籌碼雷達的策略判定、景氣頁、訊號總覽都要它。2026-10-21 踩坑：這裡原本只裝
      # certifi，每班建頁都把機會頁的策略判定洗成「次數不夠」（推薦全空），等下一班 daily／afterhours
      # 重建才回來；景氣頁與訊號總覽則整頁不重建。比照那兩支 workflow 安裝（失敗只告警、不擋持股落檔）。
      - name: 安裝相依（certifi＋建頁用的 numpy）
        run: pip install --quiet certifi && (pip install --quiet numpy || echo "::warning::numpy 安裝失敗——籌碼雷達策略判定、景氣頁與訊號總覽本班不重建")

      - name: 抓每日持股（第一手優先；停更或抓不到則 etfinfo 頂替＋第三方構成驗證）
        run: |
          if [ "${{ inputs.probe }}" = "true" ]; then
            TZ=Asia/Taipei python3 scripts/fetch_etf_holdings.py --probe
          else
            TZ=Asia/Taipei python3 scripts/fetch_etf_holdings.py
          fi

      - name: 籌碼雷達 ETF 部位快照＋規模前段擴充 ETF 持股（etfinfo；失敗不擋）
        if: inputs.probe != true
        run: TZ=Asia/Taipei timeout 240 python3 scripts/fetch_lab.py --extra || true

      - name: 持股簡介缺口（新換進的 ETF 持股缺簡介 → 缺口檔＋儀表板紅章，15:33 班補；不擋發佈）
        if: inputs.probe != true
        run: TZ=Asia/Taipei python3 scripts/check_holdings_intro.py || true

      - name: 重建儀表板（2026-07-30 使用者：持股更新排進每日循環——傍晚抓完直接上線，
              當日貢獻當晚可見，不等隔日早上 daily.yml）
        if: inputs.probe != true
        run: TZ=Asia/Taipei python3 scripts/gen_fund_dashboard.py

      - name: 儀表板輕量結構檢查（截斷／關鍵區塊消失→紅、壞頁不出門；多人化 Phase 1-②）
        if: inputs.probe != true
        run: TZ=Asia/Taipei python3 scripts/smoke_dashboard.py --lite dashboard/index.html

      - name: commit 持股落檔＋儀表板
        if: inputs.probe != true
        run: |
          git config user.name "josephchan00000"
          git config user.email "51159474+josephchan00000@users.noreply.github.com"
          git add -f data/etf_holdings.json 2>/dev/null || true
          git add -f data/stock_industry.json 2>/dev/null || true
          git add -f data/holdings_intro_gap.json 2>/dev/null || true  # 持股簡介缺口（含 ETF 持股，2026-10-21）
          git add dashboard/index.html 2>/dev/null || true
          git add -f data/lab dashboard/x9.html 2>/dev/null || true   # 籌碼雷達（分片＋隱藏頁，2026-10-14）
          git add -f dashboard/x9s.json 2>/dev/null || true             # 籌碼雷達個股走勢序列（開個股卡才載入；分開 add：缺檔時不連累上一行的分片）
          git add -f dashboard/x9t.json 2>/dev/null || true             # 公司分析：全市場每日小表（docs/lab_company_plan.md；分開 add）
          git add -f dashboard/x9f.json 2>/dev/null || true             # 法人預估：每檔資料（docs/lab_forward_plan.md；分開 add）
          git add -f dashboard/x9m.html 2>/dev/null || true            # 景氣溫度頁（docs/lab_heat_plan.md；分開 add）
          git add -f dashboard/x9mh.json 2>/dev/null || true           # 景氣溫度頁對照圖資料（第五版；分開 add）
          git add -f dashboard/x9mu.html 2>/dev/null || true           # 美股景氣頁（docs/lab_heat_us_plan.md；分開 add）
          git add -f dashboard/x9b.html 2>/dev/null || true            # 泡沫頁（轉址到市場頁；docs/lab_ia_v5_plan.md；分開 add）
          git add -f dashboard/x9o.html 2>/dev/null || true            # 訊號總覽（轉址到市場頁；docs/lab_ia_v5_plan.md；分開 add）
          git add -f dashboard/x9oh-*.json 2>/dev/null || true         # 每一次的清單（每個市場一個檔，點開指標才下載；docs/lab_ia_v5_plan.md；分開 add）
          git add -f dashboard/x9or-*.json 2>/dev/null || true         # 訊號總覽各市場的研究卡（點了才載入；分開 add）
          git add -f dashboard/x9pr-*.json 2>/dev/null || true         # 訊號總覽實測區各市場的細節（點到那個市場才載入；分開 add）
          git add -f dashboard/x9x.html 2>/dev/null || true            # 大神策略頁（docs/lab_nav_plan.md；分開 add）
          git add -f dashboard/x9xh.json 2>/dev/null || true           # 大神策略的淨值與每一筆（點開才下載；分開 add）
          git add -f dashboard/x9r.html 2>/dev/null || true            # 研究紀錄頁（docs/lab_ia_v5_plan.md 第 7 節；分開 add）
          git add -f dashboard/x9muh-*.json 2>/dev/null || true        # 美股景氣頁各指數對照圖資料（分開 add）
          git add -f dashboard/co 2>/dev/null || true                  # 公司分析：每檔資料檔（點進去才下載；內容沒變不改寫）
          git commit -m "chore: ETF 每日持股更新 $(date +%F)" || { echo "無變更，跳過 push"; exit 0; }
          # main 可能被其他 workflow 推進 → rebase 重試；rebase 後用合併結果重建再推
          #（同 daily.yml 慣例：-X theirs 會拼出新舊混雜的 index.html，必須重建）
          for i in 1 2 3; do
            git push && exit 0
            echo "push 被拒（第 $i 次），rebase 後重建儀表板再重試…"
            git pull --rebase -X theirs origin main || git rebase --abort || true
            TZ=Asia/Taipei python3 scripts/gen_fund_dashboard.py || true
            git add dashboard/index.html 2>/dev/null || true
            git add -f data/lab dashboard/x9.html 2>/dev/null || true   # 籌碼雷達（分片＋隱藏頁，2026-10-14）
            git add -f dashboard/x9s.json 2>/dev/null || true             # 籌碼雷達個股走勢序列（開個股卡才載入；分開 add：缺檔時不連累上一行的分片）
            git add -f dashboard/x9t.json 2>/dev/null || true             # 公司分析：全市場每日小表（docs/lab_company_plan.md；分開 add）
            git add -f dashboard/x9f.json 2>/dev/null || true             # 法人預估：每檔資料（docs/lab_forward_plan.md；分開 add）
            git add -f dashboard/x9m.html 2>/dev/null || true            # 景氣溫度頁（docs/lab_heat_plan.md；分開 add）
            git add -f dashboard/x9mh.json 2>/dev/null || true           # 景氣溫度頁對照圖資料（第五版；分開 add）
            git add -f dashboard/x9mu.html 2>/dev/null || true           # 美股景氣頁（docs/lab_heat_us_plan.md；分開 add）
            git add -f dashboard/x9b.html 2>/dev/null || true            # 泡沫頁（轉址到市場頁；docs/lab_ia_v5_plan.md；分開 add）
            git add -f dashboard/x9o.html 2>/dev/null || true            # 訊號總覽（轉址到市場頁；docs/lab_ia_v5_plan.md；分開 add）
            git add -f dashboard/x9oh-*.json 2>/dev/null || true         # 每一次的清單（每個市場一個檔，點開指標才下載；docs/lab_ia_v5_plan.md；分開 add）
            git add -f dashboard/x9or-*.json 2>/dev/null || true         # 訊號總覽各市場的研究卡（點了才載入；分開 add）
            git add -f dashboard/x9pr-*.json 2>/dev/null || true         # 訊號總覽實測區各市場的細節（點到那個市場才載入；分開 add）
            git add -f dashboard/x9x.html 2>/dev/null || true            # 大神策略頁（docs/lab_nav_plan.md；分開 add）
            git add -f dashboard/x9xh.json 2>/dev/null || true           # 大神策略的淨值與每一筆（點開才下載；分開 add）
            git add -f dashboard/x9r.html 2>/dev/null || true            # 研究紀錄頁（docs/lab_ia_v5_plan.md 第 7 節；分開 add）
            git add -f dashboard/x9muh-*.json 2>/dev/null || true        # 美股景氣頁各指數對照圖資料（分開 add）
            git add -f dashboard/co 2>/dev/null || true                  # 公司分析：每檔資料檔（點進去才下載；內容沒變不改寫）
            git commit --amend --no-edit || true
            sleep 5
          done
          echo "::error::push 連續失敗——本次持股未入 main"; exit 1

      - name: 觸發 Vercel 部署（Deploy Hook；未設 secret 則跳過、靠自動偵測）
        if: inputs.probe != true
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "（未設 VERCEL_DEPLOY_HOOK secret，跳過主動部署）"; exit 0
          fi
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK" -w "\nHTTP %{http_code}\n" \
            || echo "deploy hook 呼叫失敗（不影響已入庫的 commit）"

      - name: 對時哨兵（驗線上頁已吃到 main 最新建表；多人化 Phase 1-①，2026-08-14）
        # 本場次無 commit 時線上「本來就該」等於 main，一樣驗＝免費的漂移偵測；
        # 哨兵紅≠資料有問題（資料已入 main），診斷見 CLAUDE.md 步驟 9 部署踩坑條。
        if: inputs.probe != true
        run: |
          git fetch origin main --depth=1
          git show FETCH_HEAD:dashboard/index.html > /tmp/main_dashboard.html
          python3 scripts/check_live_deploy.py --expected-file /tmp/main_dashboard.html
