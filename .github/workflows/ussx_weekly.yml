name: 美股飆股資料每週更新（資料分支）

# docs/lab_us_sleeve_plan.md 第 10.4 節：美股飆股前瞻記錄要的資料——下市的公司當時就記下來，才沒有存活偏誤。
# 每週六台北 10:05（UTC 02:05，美股週五收盤以後），在資料分支 claude/ussx-data 上更新：
#   那斯達克篩選器、財報行事曆（新的日子）、新代號的股價、全部代號最近兩週的股價、SEC 財報（有 secret SEC_CONTACT_EMAIL 才抓）。
# 資料兩三百 MB，只 commit 回資料分支，不進 main。排程只在 main 上跑，所以這支檔放 main、checkout 資料分支。

on:
  schedule:
    - cron: '5 2 * * 6'
  workflow_dispatch:

concurrency:
  group: ussx-weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  weekly:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/ussx-data
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依（純標準庫 + certifi）
        run: pip install --quiet certifi

      - name: 更新
        env:
          SEC_CONTACT_EMAIL: ${{ secrets.SEC_CONTACT_EMAIL }}   # 只有 SEC 那一段讀（arm/lab/secfin.py），不印、不存
        run: timeout 6000 python3 scripts/backfill_ussx.py --weekly --budget-min 90

      - name: commit 回資料分支
        run: |
          git config user.name "josephchan00000"
          git config user.email "51159474+josephchan00000@users.noreply.github.com"
          git add -f data/lab/ussx data/lab/usstk 2>/dev/null || true
          git commit -q -m "chore: 美股飆股資料每週更新 $(date '+%F %H:%M')" || { echo "無變更"; exit 0; }
          for i in 1 2 3; do
            git push origin HEAD:claude/ussx-data && exit 0
            git pull --rebase origin claude/ussx-data || git rebase --abort || true
            sleep 5
          done
          echo "::error::push 失敗"; exit 1
