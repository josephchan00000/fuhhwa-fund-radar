name: 新策略候選（合併、回測、試用紀錄）

# docs/lab_ia_v5_plan.md 第 24 節；框架規格 arm/lab/candspec.py。
# ① push 到 claude/** 而且動到 config/strategy_candidates.json、arm/lab/cands/ 或 config/strategy_board.json：從那個分支「只拿」
#   規格、候選程式、strategy_board.json 的 cand（使用者在對話回的「試用／納入／不納入」；其他欄位照 main）這三個地方，
#   用 main 上的檢查（scripts/run_cands.py --merge-from、tests/test_cands.py）驗過才合併——舊的一字不差、沒有刪、新的最多 2 條、
#   還沒決定的最多 10 條。驗過就回測新候選；新的候選要乾淨地算完（沒有出錯、沒有用到未來的資料）才合併——
#   規格、程式、結果一起 commit 進 main，再派一輪 daily.yml 重建頁面。沒算完＝這一輪紅、什麼都不合併（還沒進 main 的候選可以修好再推）。
# ② 每週日台北 19:00（UTC 11:00）：試用中的候選補紀錄、還沒有結果的補算（Routine「策略探勘週報」是 20:00）。
# ③ 手動：ref＝要拿候選的分支（空白＝只用 main 現有的）、force＝全部重算。
# 有美股的候選才拿資料分支 claude/ussx-data（只拿美股資料那兩個資料夾）。

on:
  push:
    branches: ['claude/**']
    paths: ['config/strategy_candidates.json', 'arm/lab/cands/**', 'config/strategy_board.json']
  schedule:
    - cron: '0 11 * * 0'
  workflow_dispatch:
    inputs:
      ref:
        description: '（選用）從這個分支拿候選；空白＝只用 main 現有的'
        required: false
        default: ''
      force:
        description: '全部重算（true／false）'
        required: false
        default: 'false'

concurrency:
  group: strategy-cands
  cancel-in-progress: false

permissions:
  contents: write
  actions: write

jobs:
  cands:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      TZ: Asia/Taipei
      BR: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.ref }}
      FORCE: ${{ github.event.inputs.force }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依
        run: pip install --quiet certifi numpy pytest

      - name: main 上有沒有候選機制（還沒合併前的推送直接略過）
        id: guard
        run: |
          if [ -f scripts/run_cands.py ] && [ -f tests/test_cands.py ]; then echo "ok=true" >> "$GITHUB_OUTPUT"
          else echo "main 上還沒有候選機制，略過"; echo "ok=false" >> "$GITHUB_OUTPUT"; fi

      - name: 從分支拿候選（只拿規格與 arm/lab/cands/c###.py，用 main 的檢查）
        id: merge
        if: steps.guard.outputs.ok == 'true' && env.BR != '' && env.BR != 'main'
        run: |
          git fetch -q --depth 1 origin "$BR"
          mkdir -p br
          for p in config/strategy_candidates.json arm/lab/cands config/strategy_board.json; do
            git archive FETCH_HEAD "$p" 2>/dev/null | tar -x -C br || true
          done
          python3 scripts/run_cands.py --merge-from br
          python3 -m pytest -q tests/test_cands.py tests/test_candspec.py

      - name: 這一輪要不要美股資料
        id: need
        if: steps.guard.outputs.ok == 'true'
        run: python3 scripts/run_cands.py --need-us --forward

      - name: 美股資料（資料分支，只拿美股那兩個資料夾）
        if: steps.need.outputs.us == 'true'
        uses: actions/checkout@v4
        with:
          ref: claude/ussx-data
          path: ussxdata
          fetch-depth: 1
          sparse-checkout: |
            data/lab/ussx
            data/lab/usstk

      - name: 回測新候選、試用紀錄
        id: run
        if: steps.guard.outputs.ok == 'true'
        run: |
          [ -d ussxdata/data/lab/ussx ] && export USSX_DIR="$GITHUB_WORKSPACE/ussxdata/data/lab/ussx"
          ARGS="--compute --forward"
          [ "$FORCE" = "true" ] && ARGS="$ARGS --force"
          timeout 6000 python3 scripts/run_cands.py $ARGS --new "${{ steps.merge.outputs.new }}"

      - name: commit 進 main
        id: commit
        if: steps.guard.outputs.ok == 'true'
        run: |
          git config user.name "josephchan00000"
          git config user.email "51159474+josephchan00000@users.noreply.github.com"
          git add -f config/strategy_candidates.json arm/lab/cands config/strategy_board.json data/lab/cands_research.json data/lab/cands_live.json 2>/dev/null || true
          git commit -q -m "chore: 策略候選 $(date '+%F %H:%M')${BR:+（${BR}）}" || { echo "沒有變更"; exit 0; }
          for i in 1 2 3; do
            if git push origin HEAD:main; then echo "changed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
            git pull --rebase origin main || git rebase --abort || true
            sleep 5
          done
          echo "::error::push 到 main 失敗"; exit 1

      - name: 重建頁面（有新結果或新決定時；daily.yml 留空 news_ref＝只用 main 現有新聞重刷）
        if: steps.commit.outputs.changed == 'true' && github.event_name != 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run daily.yml --ref main || echo "::warning::派 daily.yml 失敗（下一班自然會重建）"
