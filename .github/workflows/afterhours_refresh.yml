name: 盤後數據刷新（籌碼／ETF 績效／NAV 當晚更新）

# 2026-07-31 使用者需求：「數據的部分不要都等到隔天早上才更新」。
# 台股收盤後官方數據是「分批公布」的，本 workflow 在兩個時點把「當天就拿得到」的數據刷上線：
#   · 台北 15:40（UTC 07:40）——三大法人買賣超（TWSE ~15:00 公布）、外資台指期未平倉
#     （期交所 15:00 後才有已結算資料）、ETF 當日漲跌／收盤價／週月報酬（收盤價已出）、
#     全球市場溫度計（Yahoo 序列取到台股收盤後的最新值）。
#   · 台北 22:05（UTC 14:05）——融資融券（TWSE 晚間公布）、P/C 比補刷，外加基金 NAV
#     （境內基金淨值多在晚間公布——抓得到就當晚上線；抓不到沿用既有快照，隔日清晨
#     daily.yml 照常兜底，行為與現有防呆一致）。
# 不碰新聞（reports/**）——AI 產的新聞維持每日早上 Routine＋daily.yml 的路徑。
# 為何不做 30 分鐘輪詢（2026-07-31 與使用者確認過）：這些來源一天只更新一次，
# 高頻輪詢 95% 是空轉，還放大對 etfinfo／TWSE／期交所的請求量與被封鎖風險。
# 慣例照 etf_holdings.yml：獨立 workflow、不佔 daily.yml 早上的關鍵路徑；
# 無 diff 就不 commit、失敗不影響任何現有功能。
#
# 2026-08-03 改版（使用者需求：一早／收盤後 2 小時／18~19 點三個時窗都要即時）：
# GitHub cron 是 best-effort——本 repo 實測**系統性遲到 1~3 小時、偶爾整班消失**
# （15:40 班史上首次 schedule 觸發是 08-03 18:56、當晚 22:05 班根本沒來；
#  etf_holdings 17:40 班連續五個交易日遲 1.5~3 小時）。因此準時性不靠 cron：
#   · 主路徑＝claude.ai Routine（台北 15:33／18:58，準時到分）火進主會話打 workflow_dispatch；
#   · cron 三班（15:40／19:10／22:05）只當「遲到也會到」的自癒兜底；
#   · 重複場次由「抓取守門」零請求早退（check_afterhours_fresh.py --guard），
#     對 TWSE/etfinfo 的請求量不因多班而放大——這不是高頻輪詢，仍是對齊公布時點的事件驅動。
#   · 「當日完整性看門狗」（同腳本 --write/--assert）：時間到了當日數據還沒上 →
#     警示檔入板（儀表板紅章）＋最後一步讓 run 標 ❌（GitHub 寄 failure 信）。
#     根治 08-03 型的靜默失敗：當天 run 全綠、無 commit、沒人知道。

on:
  schedule:
    - cron: "40 7 * * 1-5"   # 台北 15:40 收盤場次（Routine 15:33 的 cron 兜底）
    - cron: "10 11 * * 1-5"  # 台北 19:10 晚間場次（Routine 18:58 的 cron 兜底；≥18 時會加抓 NAV）
    - cron: "5 14 * * 1-5"   # 台北 22:05 夜間場次（融資融券 ~21:30 公布後的掃尾）
  workflow_dispatch:
  push:
    branches: ['claude/**']
    paths: ['.ping/afterhours']   # MCP-less 備援：Routine 會話沒有 GitHub MCP 時，
                                  # push 一筆只動此哨兵檔的 commit 即可觸發（正式抓取仍 checkout main）

concurrency:
  group: afterhours-refresh
  cancel-in-progress: false   # 與 daily.yml／etf_holdings.yml 的競態由 push 步驟 rebase 重試吸收

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    # 2026-08-07 教訓：timeout 連「排隊等 runner」的時間一起算——08-06 深夜 22:05 班
    # 遲到 2 小時又重複觸發，撞上 GitHub runner 容量低谷，兩班都排隊滿 15 分鐘拿不到
    # 機器就被此 timeout 砍掉 → run ❌ 寄了兩封 failure 信（資料其實早在 21:05 班全數
    # 入庫、零影響）。工作本體僅 1~2 分鐘，30 分鐘全是給排隊的容忍度；真正的資料缺口
    # 警報仍由「完整性斷言」負責，與此無關。
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # 正式抓取一律以 main 為準（同 etf_holdings.yml 慣例）

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: 安裝相依（純標準庫 + certifi）
        run: pip install --quiet certifi pypdf && (pip install --quiet numpy xlrd openpyxl || echo "::warning::numpy／xlrd／openpyxl 安裝失敗——美股景氣的 LPPLS 與 xls 來源跳過")

      - name: 抓取守門（目標數據已到位／30 分內剛抓過 → 零請求早退，多班次不放大來源站請求）
        id: pre
        run: |
          DECISION=$(python3 scripts/check_afterhours_fresh.py --guard)
          DECISION=${DECISION##*$'\n'}   # 只取最後一行（RUN／SKIP）：說明印 stderr，這行是保險（2026-10-23 多一行就整班當掉）
          echo "decision=$DECISION" >> "$GITHUB_OUTPUT"
          echo "守門判定：$DECISION"

      - name: 抓盤後數據（籌碼＋ETF 追蹤；台北 18:00 後的場次加抓基金 NAV）
        if: steps.pre.outputs.decision == 'RUN'
        run: |
          # 兩支互不相依，比照 daily_fund.sh 平行跑；各自失敗只沿用既有落檔、不擋另一支
          ( timeout -k 10 300 python3 scripts/fetch_macro_chips.py \
              || echo "  ⚠ 總經・籌碼抓取失敗或逾時，沿用既有落檔" ) &
          P_MACRO=$!
          # timeout：2026-09-24 兩班卡在本支 30 分鐘無輸出、整個 run 被 job timeout 砍掉，
          # 連已抓好的籌碼／NAV 都沒 commit。正常約 100 秒，逾 10 分鐘直接放棄（沿用既有落檔）。
          ( timeout -k 10 600 python3 -u scripts/fetch_etf_watch.py \
              || echo "  ⚠ ETF 追蹤抓取失敗或逾時，沿用既有落檔" ) &
          P_ETF=$!
          wait "$P_MACRO" || true
          wait "$P_ETF" || true
          # 晚間場次（22:05；手動 dispatch 依當下時間同規則）：境內基金淨值多在晚間公布
          if [ "$(date +%H)" -ge 18 ]; then
            echo "晚間場次：加抓基金 NAV／持股（抓不到沿用既有快照）…"
            timeout -k 10 600 python3 scripts/fetch_holdings.py || echo "  ⚠ NAV 抓取失敗或逾時，沿用既有快照"
            # NAV 抓取可能帶回新持股 → 照三道防呆慣例更新簡介缺口檔（不擋發佈）
            python3 scripts/check_holdings_intro.py || true
          fi

      - name: 籌碼雷達官方個股價量／籌碼（只補缺部件、資料齊時零請求；失敗不擋）
        run: timeout 300 python3 scripts/fetch_lab.py || echo "  ⚠ 籌碼雷達抓取失敗，沿用既有分片"

      - name: 法人預估（鉅亨 FactSet 快訊補到現在＋Yahoo 分析師一天一次；docs/lab_forward_plan.md，失敗不擋）
        run: timeout 420 python3 scripts/fetch_fcst.py || echo "  ⚠ 法人預估抓取失敗，沿用既有落檔"

      - name: 景氣溫度頁資料（融資、法人、期權、匯率、美國利率物價、國發會、廣度；docs/lab_heat_plan.md，失敗不擋）
        run: timeout 420 python3 scripts/fetch_heat.py || echo "  ⚠ 景氣溫度資料抓取失敗，沿用既有落檔"

      - name: 美股景氣頁資料（指數、聯準會、CFTC、BLS、Shiller、LPPLS 每週；docs/lab_heat_us_plan.md，失敗不擋）
        run: timeout 420 python3 scripts/fetch_heat_us.py || echo "  ⚠ 美股景氣資料抓取失敗，沿用既有落檔"

      - name: 當日完整性看門狗（寫/清 data/afterhours_alert.json——儀表板紅章資料源）
        run: python3 scripts/check_afterhours_fresh.py --write

      - name: 休市日早退（來源無任何新數據＝不重建、不 commit、不部署）
        id: guard
        run: |
          # 抓取腳本的鐵則是「抓不到就沿用既有落檔」——休市日跑完 data/ 會一個位元組都沒動。
          # 此時早退，避免只因產表時戳變動就多一筆空 commit＋一次空部署。
          if [ -z "$(git status --porcelain data/)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "data/ 無任何變更（休市日或來源尚未更新）——本場次早退"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git status --porcelain data/
          fi

      - name: 高風險數字事實核對（在籌碼刷新「之後」跑，factcheck 才對得上新值；🔴 不擋發佈）
        if: steps.guard.outputs.changed == 'true'
        run: TZ=Asia/Taipei python3 scripts/check_numbers.py || true

      - name: 重建儀表板
        if: steps.guard.outputs.changed == 'true'
        run: TZ=Asia/Taipei python3 scripts/gen_fund_dashboard.py

      - name: 儀表板輕量結構檢查（截斷／關鍵區塊消失→紅、壞頁不出門；多人化 Phase 1-②）
        if: steps.guard.outputs.changed == 'true'
        run: TZ=Asia/Taipei python3 scripts/smoke_dashboard.py --lite dashboard/index.html

      - name: commit 盤後數據＋儀表板（無變更則跳過）
        if: steps.guard.outputs.changed == 'true'
        run: |
          git config user.name "josephchan00000"
          git config user.email "51159474+josephchan00000@users.noreply.github.com"
          git add -f data/macro_chips.json 2>/dev/null || true      # 總經・籌碼（fetch_macro_chips.py 產出）
          git add -f data/etf_watch.json 2>/dev/null || true        # ETF 數據追蹤（fetch_etf_watch.py 產出）
          git add -f data/factcheck.json 2>/dev/null || true        # 數字核對結果（儀表板警示用）
          git add -f data/funds/*.json 2>/dev/null || true          # 晚間場次的 NAV 快照（未跑則無 diff）
          git add -f data/fund_nav_history.json 2>/dev/null || true # NAV 序列持久層——漏 add 會斷史（同 daily.yml）
          git add -f data/cnyes_fund_map.json 2>/dev/null || true   # 鉅亨 cnyesId 對映
          git add -f data/holdings_intro_gap.json 2>/dev/null || true  # 前十大簡介缺口警示
          git add -f data/afterhours_alert.json 2>/dev/null || true    # 盤後完整性警示（看門狗產）
          git add dashboard/index.html 2>/dev/null || true
          git add -f data/lab dashboard/x9.html 2>/dev/null || true   # 籌碼雷達（分片＋隱藏頁，2026-10-14）
          git add -f dashboard/x9s.json 2>/dev/null || true             # 籌碼雷達個股走勢序列（開個股卡才載入；分開 add：缺檔時不連累上一行的分片）
          git add -f dashboard/x9t.json 2>/dev/null || true             # 公司分析：全市場每日小表（docs/lab_company_plan.md；分開 add）
          git add -f dashboard/x9f.json 2>/dev/null || true             # 法人預估：每檔資料（docs/lab_forward_plan.md；分開 add）
          git add -f dashboard/x9m.html 2>/dev/null || true            # 景氣溫度頁（docs/lab_heat_plan.md；分開 add）
          git add -f dashboard/x9mh.json 2>/dev/null || true           # 景氣溫度頁對照圖資料（第五版；分開 add）
          git add -f dashboard/x9mu.html 2>/dev/null || true           # 美股景氣頁（docs/lab_heat_us_plan.md；分開 add）
          git add -f dashboard/x9b.html 2>/dev/null || true            # 泡沫頁（docs/lab_risk_plan.md；分開 add）
          git add -f dashboard/x9o.html 2>/dev/null || true            # 訊號總覽（docs/lab_signal_plan.md；分開 add）
          git add -f dashboard/x9oh.json 2>/dev/null || true           # 訊號總覽每一次的清單（點開才下載；分開 add）
          git add -f dashboard/x9or-*.json 2>/dev/null || true         # 訊號總覽各市場的研究卡（點了才載入；分開 add）
          git add -f dashboard/x9pr-*.json 2>/dev/null || true         # 訊號總覽實測區各市場的細節（點到那個市場才載入；分開 add）
          git add -f dashboard/x9x.html 2>/dev/null || true            # 大神策略頁（docs/lab_nav_plan.md；分開 add）
          git add -f dashboard/x9xh.json 2>/dev/null || true           # 大神策略的淨值與每一筆（點開才下載；分開 add）
          git add -f dashboard/x9muh-*.json 2>/dev/null || true        # 美股景氣頁各指數對照圖資料（分開 add）
          git add -f dashboard/co 2>/dev/null || true                  # 公司分析：每檔資料檔（點進去才下載；內容沒變不改寫）
          git commit -m "chore: 盤後數據刷新 $(date '+%F %H:%M')" || { echo "無變更，跳過 push"; exit 0; }
          # main 可能被其他 workflow 推進 → rebase 重試；rebase 後必須用合併結果重建再推
          #（同 daily.yml 慣例：-X theirs 會拼出新舊混雜的 index.html，必須重建）
          for i in 1 2 3; do
            git push && exit 0
            echo "push 被拒（第 $i 次），rebase 後重建儀表板再重試…"
            git pull --rebase -X theirs origin main || git rebase --abort || true
            TZ=Asia/Taipei python3 scripts/gen_fund_dashboard.py || true
            git add dashboard/index.html 2>/dev/null || true
            git add -f data/lab dashboard/x9.html 2>/dev/null || true   # 籌碼雷達（分片＋隱藏頁，2026-10-14）
            git add -f dashboard/x9s.json 2>/dev/null || true             # 籌碼雷達個股走勢序列（開個股卡才載入；分開 add：缺檔時不連累上一行的分片）
            git add -f dashboard/x9t.json 2>/dev/null || true             # 公司分析：全市場每日小表（docs/lab_company_plan.md；分開 add）
            git add -f dashboard/x9f.json 2>/dev/null || true             # 法人預估：每檔資料（docs/lab_forward_plan.md；分開 add）
            git add -f dashboard/x9m.html 2>/dev/null || true            # 景氣溫度頁（docs/lab_heat_plan.md；分開 add）
            git add -f dashboard/x9mh.json 2>/dev/null || true           # 景氣溫度頁對照圖資料（第五版；分開 add）
            git add -f dashboard/x9mu.html 2>/dev/null || true           # 美股景氣頁（docs/lab_heat_us_plan.md；分開 add）
            git add -f dashboard/x9b.html 2>/dev/null || true            # 泡沫頁（docs/lab_risk_plan.md；分開 add）
            git add -f dashboard/x9o.html 2>/dev/null || true            # 訊號總覽（docs/lab_signal_plan.md；分開 add）
            git add -f dashboard/x9oh.json 2>/dev/null || true           # 訊號總覽每一次的清單（點開才下載；分開 add）
            git add -f dashboard/x9or-*.json 2>/dev/null || true         # 訊號總覽各市場的研究卡（點了才載入；分開 add）
            git add -f dashboard/x9pr-*.json 2>/dev/null || true         # 訊號總覽實測區各市場的細節（點到那個市場才載入；分開 add）
            git add -f dashboard/x9x.html 2>/dev/null || true            # 大神策略頁（docs/lab_nav_plan.md；分開 add）
            git add -f dashboard/x9xh.json 2>/dev/null || true           # 大神策略的淨值與每一筆（點開才下載；分開 add）
            git add -f dashboard/x9muh-*.json 2>/dev/null || true        # 美股景氣頁各指數對照圖資料（分開 add）
            git add -f dashboard/co 2>/dev/null || true                  # 公司分析：每檔資料檔（點進去才下載；內容沒變不改寫）
            git commit --amend --no-edit || true
            sleep 5
          done
          echo "::error::push 連續失敗——本次盤後數據未入 main"; exit 1

      - name: 觸發 Vercel 部署（Deploy Hook；未設 secret 則跳過、靠自動偵測）
        if: steps.guard.outputs.changed == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "（未設 VERCEL_DEPLOY_HOOK secret，跳過主動部署）"; exit 0
          fi
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK" -w "\nHTTP %{http_code}\n" \
            || echo "deploy hook 呼叫失敗（不影響已入庫的 commit）"

      - name: 對時哨兵（驗線上頁已吃到 main 最新建表；多人化 Phase 1-①，2026-08-14）
        # 不設 guard 條件——本場次沒部署時（休市/守門早退）線上「本來就該」等於 main，
        # 一樣驗：等於免費的漂移偵測（deploy hook 失效、Vercel 漏建都會在下一班被抓到）。
        # 有部署在飛時輪詢 4 分鐘內會等到；哨兵紅≠資料有問題（資料已入 main）。
        run: |
          git fetch origin main --depth=1
          git show FETCH_HEAD:dashboard/index.html > /tmp/main_dashboard.html
          python3 scripts/check_live_deploy.py --expected-file /tmp/main_dashboard.html

      - name: 當日完整性斷言（缺數據 → 本 run 標 ❌、GitHub 寄 failure 信；放最後不擋前面發佈）
        if: always()
        run: python3 scripts/check_afterhours_fresh.py --assert
