name: 復華基金追蹤版本 每日 routine

# 每日雲端 routine：抓 25 檔基金持股介紹（海外＋台股，NAV 每日更新）
# → 產新聞提示包 → 產儀表板 → 以擁有者身分 commit 回 repo（Vercel 隨即自動部署）。
#
# 新聞「內容」採「半自動・用訂閱額度」：CI 只自動刷新 NAV／持股快照／提示包＋重建儀表板；
# 新聞內容由「會上網查證的 Claude（你的訂閱額度）」產出——每天早上請 Claude 依當日提示包
# （reports/usnews/prompts/{date}.md、reports/twnews/prompts/{date}.md）上網查證後回存：
#   · reports/usnews/{date}_v1.md、_v2.md（昨夜美股）
#   · reports/twnews/{date}.md（台股，盤前/盤後自適應）
# 未補當日新聞時，儀表板自動退回最近一份並標合規燈，不會壞。
# （備註：訂閱制 OAuth 權杖不適合放 CI 無人值守自動跑——官方 Action 有已知標頭 bug，
#  且權杖約一天過期；如日後要「新聞也全自動」，需改用計量 API 金鑰 ANTHROPIC_API_KEY。）
#
# 排程：台北時間週一~六 06:50（= UTC 前一日 22:50），讓 7:00 前跑完、打開即最新。可手動 workflow_dispatch。
# 註：GitHub cron 以 UTC 計；06:50(台北, UTC+8) = 前一日 22:50 UTC，故台北週一~六 → UTC 週日~五（0-5）。

on:
  schedule:
    - cron: "50 22 * * 0-5"
  workflow_dispatch:
    inputs:
      news_ref:
        description: '（選用）把此分支的今日新聞報告 reports/*.md 併入後再抓資料建表，一次 commit 進 main；留空＝只用 main 現有新聞重刷資料'
        required: false
        default: ''

permissions:
  contents: write          # 把當日持股快照／新聞／儀表板 commit 回 repo

jobs:
  routine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei          # commit 訊息 $(date +%F) 與所有腳本時戳一律台北時間（防 UTC 跨日錯置）
    steps:
      - uses: actions/checkout@v4
      - name: （選用）併入指定分支的今日新聞報告——讓「新聞＋真實資料」一次 commit
        if: ${{ github.event.inputs.news_ref != '' }}
        run: |
          # Claude 容器只能產新聞（被 proxy 擋、抓不到市場資料）；由此步把該分支今日
          # reports/*.md 併入，後續再抓真實 NAV／持股／ETF＋重建儀表板，最後一次 commit 進 main。
          # 根治「一天兩筆 commit（合併版舊資料＋CI 版真資料）、線上部到舊版」的坑。
          git fetch origin "${{ github.event.inputs.news_ref }}" --depth=1
          git checkout FETCH_HEAD -- reports/usnews reports/twnews reports/macronews reports/macrocal
          echo "已併入 ${{ github.event.inputs.news_ref }} 的今日新聞報告（reports/*.md）"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝相依（純標準庫 + certifi）
        run: pip install certifi

      - name: 跑每日 routine（抓持股介紹 + 產新聞提示包 + 重建儀表板）
        run: bash scripts/daily_fund.sh

      - name: 上傳儀表板與持股快照為 artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuhhwa-fund-radar
          path: |
            dashboard/index.html
            data/funds/*.json
            reports/usnews/*.md
            reports/twnews/*.md
            reports/macronews/*.md
          if-no-files-found: warn

      - name: 把當日持股快照／新聞／儀表板 commit 回 repo
        run: |
          # 以 repo 擁有者身分 commit，Vercel 才認得是團隊成員、會自動部署（bot 身分會被 Vercel 擋下）
          git config user.name "josephchan00000"
          git config user.email "51159474+josephchan00000@users.noreply.github.com"
          git add -f data/funds/*.json 2>/dev/null || true        # 分開 add：新聞 glob 為空時不會連 NAV 快照一起中止
          git add -f data/fund_news.json 2>/dev/null || true      # 基金相關新聞＋社群聲量（fetch_fund_news.py 產出）
          git add -f data/etf_watch.json 2>/dev/null || true      # ETF 數據追蹤（fetch_etf_watch.py 產出）
          git add -f reports/usnews/*_v*.md 2>/dev/null || true
          git add -f reports/twnews/*.md reports/twnews/prompts/*.md reports/usnews/prompts/*.md 2>/dev/null || true
          git add -f reports/macronews/*.md reports/macronews/prompts/*.md 2>/dev/null || true
          git add -f reports/macrocal/*.md reports/macrocal/prompts/*.md 2>/dev/null || true
          git add dashboard/index.html 2>/dev/null || true         # 入庫的儀表板產物 → Vercel Git 部署會自動更新
          git commit -m "chore: 每日持股介紹／新聞更新 $(date +%F)" || echo "無變更"
          git push || echo "push 略過（無遠端寫入權或無變更）"

      - name: 觸發 Vercel 部署（Deploy Hook — 確保線上吃到 CI 這筆真實資料版，不靠 Vercel 自動偵測）
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          # 為什麼要這步：一天有兩筆 commit——①PR 合併版（新聞新、但 NAV/持股/ETF 是舊快照，
          # 因 Claude 容器被 proxy 擋、抓不到真實資料）②本 CI 版（抓到真實 NAV）。Vercel 自動偵測
          # 曾發生「卡在 Initializing」或「部到合併版而非 CI 版」→ 線上新聞會動但淨值不動。
          # 由 CI 在 push 完後主動打 Deploy Hook，強制部署 main 最新（＝本 CI 版），根治此問題。
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "（未設 VERCEL_DEPLOY_HOOK secret，跳過主動部署——請到 repo Settings→Secrets and variables→Actions 新增，值為 Vercel 專案 Settings→Git→Deploy Hooks 建立的 main 分支 hook URL）"
            exit 0
          fi
          echo "以 Deploy Hook 觸發 Vercel production 部署（main 最新 commit）…"
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK" -w "\nHTTP %{http_code}\n" || echo "deploy hook 呼叫失敗（不影響已入庫的 commit）"
