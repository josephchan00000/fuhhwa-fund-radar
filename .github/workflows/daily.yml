name: 復華基金追蹤版本 每日 routine

# 每日雲端 routine：抓 11 檔基金持股介紹（NAV 每日更新）→ 產昨夜美股提示包 → 產儀表板。
# 註：昨夜美股「新聞內容」需會上網查證的 LLM 產出（見 scripts/daily_fund.sh 檔頭）；
#     CI 只自動刷新持股快照與提示包＋重建儀表板，新聞內容另由 Claude/人工補 reports/usnews/{date}_v*.md。
# 排程：台北時間週一~六 08:30（= UTC 前一日 00:30，抓昨夜美股後的當日 NAV/新聞）。可手動 workflow_dispatch。

on:
  schedule:
    - cron: "30 0 * * 1-6"
  workflow_dispatch: {}

permissions:
  contents: write          # 把當日持股快照 commit 回 repo

jobs:
  routine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝相依（純標準庫 + certifi）
        run: pip install certifi
      - name: 跑每日 routine（持股介紹 + 昨夜美股提示包 + 儀表板）
        run: bash scripts/daily_fund.sh
      - name: 上傳儀表板與持股快照為 artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuhhwa-fund-radar
          path: |
            dashboard/index.html
            data/funds/*.json
            reports/usnews/*.md
          if-no-files-found: warn
      - name: 把當日持股快照 commit 回 repo
        run: |
          git config user.name "fund-radar-bot"
          git config user.email "bot@users.noreply.github.com"
          git add -f data/funds/*.json reports/usnews/*_v*.md 2>/dev/null || true
          git commit -m "chore: 每日持股介紹更新 $(date +%F)" || echo "無變更"
          git push || echo "push 略過（無遠端寫入權或無變更）"
