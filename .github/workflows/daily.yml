name: 復華基金追蹤版本 每日 routine

# 每日雲端 routine：抓 25 檔基金持股介紹（海外＋台股，NAV 每日更新）
# → 產新聞提示包 → 產儀表板 → 以擁有者身分 commit 回 repo（Vercel 隨即自動部署）。
#
# 新聞「內容」採「半自動・用訂閱額度」：CI 只自動刷新 NAV／持股快照／提示包＋重建儀表板；
# 新聞內容由「會上網查證的 Claude（你的訂閱額度）」產出——每天早上請 Claude 依當日提示包
# （reports/usnews/prompts/{date}.md、reports/twnews/prompts/{date}.md）上網查證後回存：
#   · reports/usnews/{date}_v1.md、_v2.md（昨夜美股）
#   · reports/twnews/{date}.md（台股，盤前/盤後自適應）
# 未補當日新聞時，儀表板自動退回最近一份並標合規燈，不會壞。
# （備註：訂閱制 OAuth 權杖不適合放 CI 無人值守自動跑——官方 Action 有已知標頭 bug，
#  且權杖約一天過期；如日後要「新聞也全自動」，需改用計量 API 金鑰 ANTHROPIC_API_KEY。）
#
# 排程：台北時間週一~六 06:50（= UTC 前一日 22:50），讓 7:00 前跑完、打開即最新。可手動 workflow_dispatch。
# 註：GitHub cron 以 UTC 計；07:15(台北, UTC+8) = 前一日 23:15 UTC，故台北週一~六 → UTC 週日~五（0-5）。
# 排程 Routine（台北 06:35 火進主會話）為主要更新路徑；此 cron 是「事後兜底」——
# Routine 失敗時 07:15 仍以 main 現有（或分支已推的）新聞重刷真實資料，頁面不至於整天停擺。

on:
  schedule:
    - cron: "15 23 * * 0-5"
  # claude/** 分支 push 且動到 reports/** → 自動以該分支為 news_ref 跑單一 commit 流程。
  # 這讓「排程 Routine 的新會話」只需 git push 即可觸發（該類會話無 GitHub MCP 工具可用）。
  push:
    branches: ['claude/**']
    paths: ['reports/**']
  workflow_dispatch:
    inputs:
      news_ref:
        description: '（選用）把此分支的今日新聞報告 reports/*.md 併入後再抓資料建表，一次 commit 進 main；留空＝只用 main 現有新聞重刷資料'
        required: false
        default: ''

# 依事件型態分組：schedule 與 push/dispatch 各自排隊——GitHub concurrency 只保留
# 1 個 pending 席位，若同組，cron 到點會把「帶今日新聞 NEWS_REF 的 pending push-run」
# 頂掉取消 → 今日新聞永遠沒併進 main。分組後各自序列化；跨組同時跑 main 的競態
# 由 push 步驟的 rebase 重試吸收。
concurrency:
  group: daily-${{ github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write          # 把當日持股快照／新聞／儀表板 commit 回 repo

jobs:
  routine:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Taipei          # commit 訊息 $(date +%F) 與所有腳本時戳一律台北時間（防 UTC 跨日錯置）
      # 新聞來源分支：push 事件＝被推的分支；workflow_dispatch＝input；schedule＝空（只重刷資料）
      NEWS_REF: ${{ github.event_name == 'push' && github.ref_name || github.event.inputs.news_ref }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main            # push 事件預設會 checkout 被推分支——一律固定 main，新聞另行併入
      - name: 併入今日新聞報告（NEWS_REF 或 cron 兜底自動偵測）——「新聞＋真實資料」一次 commit
        run: |
          # Claude 容器只能產新聞（被 proxy 擋、抓不到市場資料）；由此步把來源分支的「今日」
          # reports/*.md 併入，後續再抓真實 NAV／持股／ETF＋重建儀表板，一次 commit 進 main。
          # 根治「一天兩筆 commit（合併版舊資料＋CI 版真資料）、線上部到舊版」的坑。
          TODAY=$(date +%F)
          REF=""
          if [ -n "$NEWS_REF" ]; then
            git fetch origin "$NEWS_REF" --depth=1
            REF=FETCH_HEAD
          else
            # cron 兜底（2026-07-18）：排程跑時自動偵測「已含今日台股報告」的最新 claude/* 分支
            # ——Routine 產完新聞但 push-run 沒觸發/失敗時，06:50 cron 仍能把新聞撿回來，不漏新聞
            git fetch origin '+refs/heads/claude/*:refs/remotes/origin/claude/*' --depth=1 || true
            best=""; best_ct=0
            for b in $(git for-each-ref --format='%(refname:short)' refs/remotes/origin/claude/ 2>/dev/null); do
              if git cat-file -e "$b:reports/twnews/${TODAY}.md" 2>/dev/null; then
                ct=$(git log -1 --format=%ct "$b" 2>/dev/null || echo 0)
                if [ "$ct" -gt "$best_ct" ]; then best_ct=$ct; best="$b"; fi
              fi
            done
            if [ -n "$best" ]; then REF="$best"; echo "cron 兜底：採用含今日報告的最新分支 $best"; fi
          fi
          if [ -z "$REF" ]; then echo "無今日新聞來源（NEWS_REF 空、無分支含今日報告）——僅重刷資料"; exit 0; fi
          # 只取「今日」檔案——整目錄 checkout 會把分支上的舊日期檔倒灌覆蓋 main（審查 #4）
          for f in "reports/usnews/${TODAY}_v1.md" "reports/usnews/${TODAY}_v2.md" \
                   "reports/twnews/${TODAY}.md" "reports/macronews/${TODAY}.md" \
                   "reports/macrocal/${TODAY}.md" \
                   "reports/usnews/prompts/${TODAY}.md" "reports/twnews/prompts/${TODAY}.md" \
                   "reports/macronews/prompts/${TODAY}.md" "reports/macrocal/prompts/${TODAY}.md"; do
            git checkout "$REF" -- "$f" 2>/dev/null && echo "  併入 $f" || true
          done
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝相依（純標準庫 + certifi）
        run: pip install certifi

      - name: 高風險數字事實核對（對證交所／期交所官方 API；🔴 不擋發佈、落檔警示）
        # 2026-07-20 使用者兩指示並行：「數字必須正確」＋「防線不可硬到什麼都沒更新」。
        # 策略：永不 fail——結果寫 data/factcheck.json 隨每日 commit 入板，儀表板顯示
        # 核對狀態（🔴 紅色警示），主會話驗證步驟看到 🔴 立即修正該數字重推。
        run: TZ=Asia/Taipei python3 scripts/check_numbers.py || true

      - name: 跑每日 routine（抓持股介紹 + 產新聞提示包 + 檢查簡介覆蓋 + 重建儀表板）
        run: bash scripts/daily_fund.sh

      - name: 上傳儀表板與持股快照為 artifact
        uses: actions/upload-artifact@v4
        with:
          name: fuhhwa-fund-radar
          path: |
            dashboard/index.html
            data/funds/*.json
            reports/usnews/*.md
            reports/twnews/*.md
            reports/macronews/*.md
          if-no-files-found: warn

      - name: 把當日持股快照／新聞／儀表板 commit 回 repo
        run: |
          # 以 repo 擁有者身分 commit，Vercel 才認得是團隊成員、會自動部署（bot 身分會被 Vercel 擋下）
          git config user.name "josephchan00000"
          git config user.email "51159474+josephchan00000@users.noreply.github.com"
          git add -f data/funds/*.json 2>/dev/null || true        # 分開 add：新聞 glob 為空時不會連 NAV 快照一起中止
          git add -f data/fund_news.json 2>/dev/null || true      # 基金相關新聞＋社群聲量（fetch_fund_news.py 產出）
          git add -f data/fund_news_seen.json 2>/dev/null || true # 新聞日期台帳（date_verify 防 Google 舊文重標日期；漏 add 會每輪重驗）
          git add -f data/etf_watch.json 2>/dev/null || true      # ETF 數據追蹤（fetch_etf_watch.py 產出）
          git add -f data/macro_chips.json 2>/dev/null || true    # 總經・籌碼數據（fetch_macro_chips.py 產出）
          git add -f data/etf_holdings.json 2>/dev/null || true   # ETF 每日持股（展開明細；漏 add 會斷「前一揭露日」、Δ 整片變 —）
          git add -f data/holdings_intro_gap.json 2>/dev/null || true  # 前十大簡介缺口警示（check_holdings_intro.py 產）
          git add -f data/fund_nav_history.json 2>/dev/null || true  # NAV 序列持久層——漏 add 會斷史、1週/1月整片變 —（審查 #1）
          git add -f data/cnyes_fund_map.json 2>/dev/null || true    # 鉅亨 cnyesId 對映
          git add -f data/factcheck.json 2>/dev/null || true         # 數字核對結果（儀表板警示用）
          git add -f reports/usnews/*_v*.md 2>/dev/null || true
          git add -f reports/twnews/*.md reports/twnews/prompts/*.md reports/usnews/prompts/*.md 2>/dev/null || true
          git add -f reports/macronews/*.md reports/macronews/prompts/*.md 2>/dev/null || true
          git add -f reports/macrocal/*.md reports/macrocal/prompts/*.md 2>/dev/null || true
          git add dashboard/index.html 2>/dev/null || true         # 入庫的儀表板產物 → Vercel Git 部署會自動更新
          git commit -m "chore: 每日持股介紹／新聞更新 $(date +%F)" || { echo "無變更，跳過 push"; exit 0; }
          # push 失敗（main 期間被推進）→ rebase 重試；rebase 衝突以本次新資料為準（-X theirs）。
          # 最終仍失敗就讓 job 真的 fail（不可吞錯綠燈——審查 #3），後面 deploy hook 自然不跑。
          # ⚠ rebase 後必須「用合併後的程式重建儀表板」再推（2026-07-22 踩坑）：-X theirs 只在
          #   衝突塊取本 run 的舊建置 HTML、非衝突塊留 main 新版 → 兩版模板改動重疊時會拼出
          #   「新舊混雜」的 index.html（實例：酒紅主題在、副標卻是改版前文案）。
          for i in 1 2 3; do
            git push && exit 0
            echo "push 被拒（第 $i 次），rebase 後重建儀表板再重試…"
            git pull --rebase -X theirs origin main || git rebase --abort || true
            TZ=Asia/Taipei python3 scripts/gen_fund_dashboard.py || true
            git add dashboard/index.html 2>/dev/null || true
            git commit --amend --no-edit || true
            sleep 5
          done
          echo "::error::push 連續失敗——本日資料未入 main"; exit 1

      - name: 觸發 Vercel 部署（Deploy Hook — 確保線上吃到 CI 這筆真實資料版，不靠 Vercel 自動偵測）
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          # 為什麼要這步：一天有兩筆 commit——①PR 合併版（新聞新、但 NAV/持股/ETF 是舊快照，
          # 因 Claude 容器被 proxy 擋、抓不到真實資料）②本 CI 版（抓到真實 NAV）。Vercel 自動偵測
          # 曾發生「卡在 Initializing」或「部到合併版而非 CI 版」→ 線上新聞會動但淨值不動。
          # 由 CI 在 push 完後主動打 Deploy Hook，強制部署 main 最新（＝本 CI 版），根治此問題。
          if [ -z "$VERCEL_DEPLOY_HOOK" ]; then
            echo "（未設 VERCEL_DEPLOY_HOOK secret，跳過主動部署——請到 repo Settings→Secrets and variables→Actions 新增，值為 Vercel 專案 Settings→Git→Deploy Hooks 建立的 main 分支 hook URL）"
            exit 0
          fi
          echo "以 Deploy Hook 觸發 Vercel production 部署（main 最新 commit）…"
          curl -sS -X POST "$VERCEL_DEPLOY_HOOK" -w "\nHTTP %{http_code}\n" || echo "deploy hook 呼叫失敗（不影響已入庫的 commit）"
