name: 歷史淨值來源探勘
# 診斷用：為新加入追蹤清單的基金探勘歷史淨值來源（容器 proxy 連不上資料站，借 CI 網路）。
# 結果從日誌讀（NAVHIST 行）。push 觸發限定本檔路徑——workflow_dispatch 進 main 前不可用。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install certifi
      - run: TZ=Asia/Taipei python3 scripts/probe_nav_history.py
