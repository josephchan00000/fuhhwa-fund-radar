name: 測試（PR 合併前）
# 體檢第 10 條（docs/code_ponytail_audit.md）：PR 進 main 之前自動跑全部測試。
# 沒裝 playwright：要瀏覽器的兩支（tests/test_plain.py、tests/test_old_urls.py）會自己略過，改主頁面時照舊手動跑。
# 公開 repo，一般機器不計分鐘（wiki/ops/ci-budget.md）。只讀程式碼、不寫檔、不推送。
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: tests-${{ github.head_ref || github.ref }}
  cancel-in-progress: true
jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Taipei
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安裝測試要的套件
        run: pip install --quiet pytest numpy pandas pyyaml certifi pypdf openpyxl
      - name: 全部測試
        run: python3 -m pytest -q
