name: 一次性 fundID 診斷掃描
# 診斷用：容器 proxy 連不上 fhtrust，借 CI 網路掃 /api/fund 的 id 區間，
# 從日誌讀出新基金（創新指數傘型 133/135 推定檔號）真實 fundID。確認後可刪本檔。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install certifi
      - run: TZ=Asia/Taipei python3 scripts/probe_fund_ids.py
